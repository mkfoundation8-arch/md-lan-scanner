name: Build Android APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install Node dependencies
        run: npm install
      
      - name: Build React app
        run: npm run build
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-levels: 35
          build-tools: 35.0.0
          ndk-version: 26.1.10909125
      
      - name: Copy web assets to Android
        run: npm run android:copy-assets
      
      - name: Make gradlew executable
        run: chmod +x android/gradlew
      
      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: android/app/build/reports/
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug
      
      - name: Get build info
        id: info
        run: |
          echo "DATE=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: app-debug.apk
          tag_name: apk-${{ steps.info.outputs.SHORT_SHA }}-${{ steps.info.outputs.DATE }}
          body: |
            # MD LAN Scanner APK Build
            
            ## Build Information
            - **Commit**: ${{ github.sha }}
            - **Short SHA**: ${{ steps.info.outputs.SHORT_SHA }}
            - **Build Date**: ${{ steps.info.outputs.DATE }}
            - **Branch**: main
            - **Trigger**: ${{ github.event_name }}
            
            ## Installation Instructions
            
            ### Method 1: Using ADB (Recommended)
            ```bash
            adb install app-debug.apk
            ```
            
            ### Method 2: Manual Installation
            1. Download the APK file
            2. Transfer to your Android device
            3. Enable \"Unknown sources\" in Settings → Security
            4. Open the file in your file manager and tap to install
            
            ### Method 3: USB Debugging
            1. Enable Developer Mode on your device (Settings > About > Build Number - tap 7 times)
            2. Enable USB Debugging in Developer Options
            3. Connect your device via USB
            4. Run: `adb install app-debug.apk`
            
            ## App Details
            - **Min SDK**: Android 6.0 (API 23)
            - **Target SDK**: Android 15 (API 35)
            - **App Name**: MD LAN Scanner
            - **Package**: com.mdlan.scanner
            - **Version**: 1.0
            
            ---
            
            Auto-generated by GitHub Actions CI/CD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
y GitHub Actions CI/CD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
